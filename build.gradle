plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '8.1.0'
}

group = 'com.rapier'
version = '1.0'

def javaVersion = JavaVersion.VERSION_17
java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    withJavadocJar()
    withSourcesJar()
}

sourceSets {
    main {
        java {
            srcDirs += 'build/generated/java'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'com.rapier.examples.BouncingBall'
}

def os = org.gradle.internal.os.OperatingSystem.current()

def nativeLibName = os.isWindows() ? 'rapier2d_jni.dll' : (os.isMacOsX() ? 'librapier2d_jni.dylib' : 'librapier2d_jni.so')

def nativeProjectDir = file('native/rapier2d_jni')
def bindgenDir = file('build/generated')

def nativeBuildDir = file("${buildDir}/native")

// Build the Rust JNI library
tasks.register('buildNative', Exec) {
    workingDir nativeProjectDir
    commandLine 'cargo', 'build', '--release'
}

tasks.register('generateBindings', Exec) {
    def rustdocJson = file("${nativeProjectDir}/target/doc/rapier2d_f64.json")
    def javaOut = file("${bindgenDir}/java")
    def rustOut = file("${projectDir}/native/rapier2d_jni/src/generated.rs")
    def manifest = file("${bindgenDir}/manifest/rapier2d-f64.json")
    def report = file("${bindgenDir}/manifest/rapier2d-f64-report.json")

    workingDir nativeProjectDir
    commandLine 'cargo', '+nightly', 'rustdoc', '-p', 'rapier2d-f64', '--lib', '--',
            '-Z', 'unstable-options', '--output-format', 'json'
    doLast {
        exec {
            commandLine 'python', "${projectDir}/tools/rapier_bindgen/generate_bindings.py",
                    '--input', rustdocJson.absolutePath,
                    '--java-out', javaOut.absolutePath,
                    '--rust-out', rustOut.absolutePath,
                    '--manifest', manifest.absolutePath,
                    '--report', report.absolutePath
        }
    }
}

// Copy the library into build/native
tasks.register('copyNative', Copy) {
    dependsOn 'buildNative'
    from(new File(nativeProjectDir, 'target/release')) {
        include nativeLibName
    }
    into nativeBuildDir
}

tasks.register('runExample', JavaExec) {
    dependsOn 'classes'
    dependsOn 'copyNative'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = (project.findProperty('exampleClass') ?: 'com.rapier.examples.BouncingBall')
    systemProperty 'java.library.path', nativeBuildDir.absolutePath
}

tasks.named('build') {
    dependsOn 'copyNative'
}

tasks.named("jar") {
    dependsOn copyNative
    from(nativeBuildDir) {
        into "natives"
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'rapier-java'
            from components.java
            pom {
                name = 'Rapier Java'
                description = 'Java bindings for the Rapier physics engine'
                url = 'https://github.com/Isaac-dot-py/rapier-java'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'Isaac-dot-py'
                        name = 'Isaac Barker'
                        email = 'barkerisaacd@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/Isaac-dot-py/rapier-java.git'
                    developerConnection = 'scm:git:ssh://github.com/Isaac-dot-py/rapier-java.git'
                    url = 'https://github.com/Isaac-dot-py/rapier-java'
                }
            }
        }
    }
    repositories {
        maven {
            name = "localBuild"
            url = layout.buildDirectory.dir(".m2")
        }
    }
}

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude 'build/**', '**/build-*/**', 'src/main/java/frc/robot/Main.java', '**/BuildConstants.java' // Main has ascii art, don't touch
        }

        toggleOffOn()
        trimTrailingWhitespace()
        endWithNewline()

        cleanthat()
                .groupArtifact('org.recordrobotics.cleanthat:java')
                .version("2.26")
                .sourceCompatibility("17")
                .addMutator("UseExplicitTypes")
                .addMutator('SafeAndConsensual')
                .addMutator('UnnecessaryFullyQualifiedName')
                .excludeMutator('LocalVariableTypeInference')
                .includeDraft(false)

        removeUnusedImports()

        palantirJavaFormat()
        formatAnnotations()
    }
    groovyGradle {
        target fileTree('.') {
            include '**/*.gradle'
            exclude '**/build/**', '**/build-*/**'
        }
        greclipse()
        leadingTabsToSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'xml', {
        target fileTree('.') {
            include '**/*.xml'
            exclude '**/build/**', '**/build-*/**'
        }
        eclipseWtp('xml')
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
    format 'misc', {
        target fileTree('.') {
            include '**/*.md', '**/.gitignore'
            exclude '**/build/**', '**/build-*/**'
        }
        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}
