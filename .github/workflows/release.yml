name: Build and Publish Library

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build and Publish
        run: |
          ./gradlew clean build publish -DskipTests

      # IMPORTANT: unique artifact name per OS
      - name: Upload Maven repo artifact
        uses: actions/upload-artifact@v6
        with:
          name: maven-repo-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: build/.m2

  local-deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Download ALL matrix artifacts for all oses
      - name: Download Linux repo
        uses: actions/download-artifact@v7
        with:
          pattern: 'maven-repo-*'
          path: ./merged-repo
          merge_multiple: true

      # Generate directory indexes
      - name: Generate directory indexes
        working-directory: ./merged-repo
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"
          find ./ -type d | while read dir; do
            relpath="${dir#./}"
            if [ -z "$relpath" ]; then
              display_path="$repo_name"
            else
              display_path="$repo_name/$relpath"
            fi
            (
              echo '<!DOCTYPE html>'
              echo '<html><head>'
              echo "<title>$display_path</title>"
              echo '</head><body><pre>'
              echo '<a href="../">../</a>'
              for f in "$dir"/*; do
                [ -e "$f" ] || continue
                fname=$(basename "$f")
                [ "$fname" = "index.html" ] && continue
                echo "<a href=\"$fname\">$fname</a>"
              done
              echo '</pre></body></html>'
            ) > "$dir/index.html"
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./merged-repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4